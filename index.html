<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tianyan Cafe</title>
    <script>
        (() => {
            const local = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
            window.__designControlsEnabled = local && new URLSearchParams(location.search).get('controls') === '1';
            if (window.__designControlsEnabled) document.documentElement.dataset.designControls = 'on';
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/gruvbox-dark-medium.min.css">
    <link rel="stylesheet" href="assets/css/gitbook-style.css?v=image-background-1">
</head>
<body>
    <canvas id="image-background" class="image-background" aria-hidden="true"></canvas>
    <!-- Top Header Bar -->
    <canvas id="header-glass-webgl" class="header-glass-webgl" aria-hidden="true"></canvas>
    <header id="top-header" class="top-header">
        <div class="header-left">
            <a href="#" class="site-logo" id="site-logo-link">
                <span class="logo-icon">T</span>
                <span class="logo-text">Gao-Tian Cafe</span>
            </a>
        </div>
        <div class="header-right">
            <button class="search-trigger" id="search-trigger">
                <i class="fas fa-search"></i>
                <span>Search...</span>
                <kbd>Ctrl K</kbd>
            </button>
        </div>
    </header>
    <div id="glass-control" class="glass-control">
        <label for="glass-ref-factor">Refraction</label>
        <input id="glass-ref-factor" type="range" min="1.01" max="2.20" step="0.01" value="1.77">
        <output id="glass-ref-factor-value">1.77</output>
        <label for="glass-ref-thickness">Stretch Width</label>
        <input id="glass-ref-thickness" type="range" min="4" max="64" step="1" value="23">
        <output id="glass-ref-thickness-value">23</output>
        <label for="glass-edge-falloff">Stretch Falloff</label>
        <input id="glass-edge-falloff" type="range" min="0.15" max="2" step="0.05" value="0.60">
        <output id="glass-edge-falloff-value">0.60</output>
        <label for="glass-reflect-thickness">Reflect Width</label>
        <input id="glass-reflect-thickness" type="range" min="2" max="48" step="1" value="12">
        <output id="glass-reflect-thickness-value">12</output>
        <label for="glass-reflect-falloff">Reflect Falloff</label>
        <input id="glass-reflect-falloff" type="range" min="0.25" max="4" step="0.05" value="0.25">
        <output id="glass-reflect-falloff-value">0.25</output>
        <label for="glass-dispersion-gain">Dispersion</label>
        <input id="glass-dispersion-gain" type="range" min="0" max="20" step="0.1" value="20.0">
        <output id="glass-dispersion-gain-value">20.0</output>
        <label for="glass-fresnel-gain">Fresnel</label>
        <input id="glass-fresnel-gain" type="range" min="0" max="1" step="0.01" value="0.00">
        <output id="glass-fresnel-gain-value">0.00</output>
        <label for="glass-glare-gain">Highlight</label>
        <input id="glass-glare-gain" type="range" min="0" max="1" step="0.01" value="0.10">
        <output id="glass-glare-gain-value">0.10</output>
        <label for="glass-shadow-gain">Shadow</label>
        <input id="glass-shadow-gain" type="range" min="0" max="0.4" step="0.01" value="0.20">
        <output id="glass-shadow-gain-value">0.20</output>
        <label for="glass-blur-radius">Blur</label>
        <input id="glass-blur-radius" type="range" min="0" max="12" step="0.5" value="1.5">
        <output id="glass-blur-radius-value">1.5</output>
        <label for="glass-alpha">Reflect Alpha</label>
        <input id="glass-alpha" type="range" min="0" max="1" step="0.01" value="1.00">
        <output id="glass-alpha-value">1.00</output>
        <label for="glass-glare-angle">Glare Angle</label>
        <input id="glass-glare-angle" type="range" min="-3.14" max="3.14" step="0.01" value="-0.79">
        <output id="glass-glare-angle-value">-0.79</output>
    </div>

    <div id="app">
        <!-- Left Sidebar -->
        <aside id="sidebar" class="sidebar">
            <nav id="main-nav" class="main-nav">
                <!-- Navigation will be generated from config -->
            </nav>
        </aside>
        
        <!-- Main Content -->
        <main id="main-content" class="main-content">
            <div class="content-wrapper">
                <div class="content-header-bar">
                    <div id="breadcrumb" class="breadcrumb">
                        <!-- Breadcrumb -->
                    </div>
                </div>
                
                <article id="page-content" class="page-content">
                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>Loading...</span>
                    </div>
                </article>
            </div>
        </main>
    </div>
    <div id="page-glass-scrollbar" class="page-glass-scrollbar" aria-hidden="true">
        <div class="page-glass-scrollbar-thumb"></div>
    </div>
    
    <!-- Search Modal -->
    <div id="search-modal" class="search-modal">
        <div class="search-modal-content">
            <div class="search-modal-header">
                <i class="fas fa-search"></i>
                <input type="text" id="search-modal-input" placeholder="Search...">
                <kbd>ESC</kbd>
            </div>
            <div id="search-results" class="search-results">
            </div>
        </div>
    </div>

    <script>
        if (!window.__designControlsEnabled) document.getElementById('glass-control')?.remove();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
    <script src="assets/js/html2canvas.min.js?v=1.4.1"></script>
    <script src="assets/js/backgroundImageRevealWebGL.js?v=image-webgl-5"></script>
    <script src="assets/js/liquidGlassWebGL.js?v=studio-webgl-78"></script>
    <script src="assets/js/site.js?v=liquid-glass-studio-5"></script>
</body>
</html>
